<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV Lifestyle — Admin Dashboard</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/DZh18dK7/pvlogo-removebg-preview.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --orange:#e18a3f;
    --orange-light:#f3a663;
    --orange-dark:#b96a26;
    --charcoal:#3f4749;
    --charcoal-deep:#262b2c;
    --charcoal-deeper:#181b1c;
    --cream:#f7f2ea;
    --white:#ffffff;
    --danger:#c0392b;
    --border:#e4ded2;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; width:100%; }
  body{
    font-family:'Manrope', system-ui, sans-serif;
    background:var(--cream);
    color:var(--charcoal-deep);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ margin:0; }
  .font-display{ font-family:'Bebas Neue', sans-serif; letter-spacing:.02em; }
  .hidden{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea{ font-family:inherit; }

  /* ===== LOGIN SCREEN ===== */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--charcoal-deeper);
    padding:1.5rem;
  }
  .login-card{
    background:var(--cream); border-radius:20px; padding:clamp(2rem,5vw,3rem);
    max-width:400px; width:100%; text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.5);
  }
  .login-card img{ height:56px; margin-bottom:1rem; }
  .login-card h1{ font-size:2rem; color:var(--charcoal-deeper); }
  .login-card p{ color:var(--charcoal); font-size:.9rem; margin-top:.5rem; margin-bottom:1.75rem; }
  .google-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.65rem;
    width:100%; background:var(--white); color:var(--charcoal-deeper);
    border:1.5px solid var(--border); border-radius:12px;
    padding:.85rem 1.25rem; font-weight:700; font-size:.95rem;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .google-btn:hover{ background:#faf8f4; box-shadow:0 8px 20px -10px rgba(0,0,0,.25); }
  .login-error{
    margin-top:1.25rem; background:rgba(192,57,43,.1); color:var(--danger);
    border:1px solid rgba(192,57,43,.3); border-radius:10px; padding:.75rem 1rem;
    font-size:.82rem; text-align:left; line-height:1.5;
  }

  /* ===== DASHBOARD SHELL ===== */
  #dashboard{ display:flex; min-height:100vh; }

  .sidebar{
    width:250px; flex-shrink:0; background:var(--charcoal-deeper); color:var(--cream);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:.65rem; padding:1.25rem 1.15rem;
    border-bottom:1px solid rgba(247,242,234,.1);
  }
  .sidebar-brand img{ height:32px; }
  .sidebar-brand span{ font-family:'Bebas Neue',sans-serif; font-size:1.2rem; letter-spacing:.04em; }
  #sidebarNav{ display:flex; flex-direction:column; padding:.75rem; gap:.15rem; overflow-y:auto; flex:1; }
  .tab-btn{
    text-align:left; background:none; border:none; color:rgba(247,242,234,.72);
    padding:.7rem .9rem; border-radius:10px; font-weight:600; font-size:.88rem;
    transition:background .2s ease, color .2s ease;
  }
  .tab-btn:hover{ background:rgba(247,242,234,.06); color:var(--cream); }
  .tab-btn.active{ background:var(--orange); color:var(--charcoal-deeper); }
  .sidebar-footer{ padding:1rem; border-top:1px solid rgba(247,242,234,.1); }
  .sidebar-footer .user-email{ font-size:.72rem; color:rgba(247,242,234,.55); word-break:break-all; margin-bottom:.65rem; }
  .btn-logout{
    width:100%; background:rgba(247,242,234,.08); color:var(--cream); border:1px solid rgba(247,242,234,.15);
    border-radius:8px; padding:.55rem; font-weight:700; font-size:.8rem;
    transition:background .2s ease;
  }
  .btn-logout:hover{ background:rgba(247,242,234,.16); }

  .main-area{ flex:1; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:1rem clamp(1rem,3vw,2.5rem); background:var(--white); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{ font-size:1.05rem; font-weight:800; }
  .btn-view-site{
    display:inline-flex; align-items:center; gap:.4rem; background:var(--charcoal-deeper); color:var(--cream);
    padding:.55rem 1rem; border-radius:999px; font-weight:700; font-size:.8rem; border:none;
  }
  .btn-view-site:hover{ background:var(--charcoal); }

  #panelsContainer{ padding:clamp(1.25rem,3vw,2.5rem); max-width:920px; }
  .panel{ display:none; animation:fadeIn .25s ease; }
  .panel.active{ display:block; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .panel-title{ font-size:1.9rem; margin-bottom:1.5rem; color:var(--charcoal-deeper); }

  .field{ margin-bottom:1.25rem; }
  .field-label{ display:block; font-size:.78rem; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--charcoal); margin-bottom:.4rem; }
  .field-input{
    width:100%; border:1.5px solid var(--border); border-radius:10px; padding:.7rem .85rem;
    font-size:.92rem; background:var(--white); color:var(--charcoal-deeper); resize:vertical;
    transition:border-color .2s ease;
  }
  .field-input:focus{ outline:none; border-color:var(--orange); }
  .field-input.small{ font-size:.82rem; padding:.5rem .6rem; }

  .toggle-row{ display:flex; align-items:center; gap:.6rem; margin-bottom:1.5rem; font-weight:700; font-size:.85rem; cursor:pointer; }
  .toggle-row input{ width:18px; height:18px; accent-color:var(--orange); cursor:pointer; }

  .list-manager{ margin-top:2rem; border-top:1px solid var(--border); padding-top:1.5rem; }
  .list-manager-header h4{ font-size:1.1rem; font-weight:800; }
  .list-hint{ font-size:.78rem; color:var(--charcoal); opacity:.75; margin-top:.25rem; margin-bottom:1rem; line-height:1.5; }
  .hidden-file-input{ display:none; }
  .btn-add{
    background:var(--orange); color:var(--charcoal-deeper); border:none; border-radius:999px;
    padding:.6rem 1.1rem; font-weight:800; font-size:.82rem; margin-bottom:1.25rem;
    transition:background .2s ease, transform .2s ease;
  }
  .btn-add:hover{ background:var(--orange-light); transform:translateY(-2px); }

  .image-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:1rem; }
  .empty-state{ font-size:.85rem; color:var(--charcoal); opacity:.6; grid-column:1/-1; padding:1.5rem; text-align:center; border:1.5px dashed var(--border); border-radius:12px; }
  .image-card{ background:var(--white); border:1px solid var(--border); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .image-thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--border); }
  .image-card-fields{ padding:.6rem .6rem 0; display:flex; flex-direction:column; gap:.4rem; }
  .image-card-actions{ display:flex; gap:.4rem; padding:.6rem; margin-top:auto; }
  .icon-btn{
    flex:1; background:var(--cream); border:1px solid var(--border); border-radius:8px;
    padding:.4rem; font-weight:700; font-size:.85rem; color:var(--charcoal-deeper);
    transition:background .2s ease;
  }
  .icon-btn:hover:not(:disabled){ background:var(--orange); color:var(--charcoal-deeper); border-color:var(--orange); }
  .icon-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .icon-btn.danger:hover{ background:var(--danger); color:var(--white); border-color:var(--danger); }

  /* ===== TOAST ===== */
  #toast{
    position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--charcoal-deeper); color:var(--cream); padding:.75rem 1.4rem; border-radius:999px;
    font-size:.85rem; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:100; box-shadow:0 15px 30px -10px rgba(0,0,0,.4);
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.toast-error{ background:var(--danger); }

  @media (max-width:860px){
    #dashboard{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto; }
    .sidebar-brand{ display:none; }
    #sidebarNav{ flex-direction:row; overflow-x:auto; }
    .tab-btn{ white-space:nowrap; }
    .sidebar-footer{ display:none; }
    .topbar{ flex-wrap:wrap; }
  }
</style>
</head>
<body>

  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getDatabase, ref, onValue, set, update, push, remove
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ============================================================
  // 1) PASTE YOUR FIREBASE PROJECT CONFIG HERE

  const firebaseConfig = {
      apiKey: "AIzaSyCh7Ute6LeSAxcNDEQwZg5m0cA4ujnLCfg",

  ];

  // ============================================================
  // Cloudinary (unsigned upload preset)

  const CLOUDINARY_CLOUD = 'dqkujefxj';
  const CLOUDINARY_PRESET = 'banter_box';

  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST',
      body: formData
    });
    if (!res.ok) throw new Error('Cloudinary upload failed');
    const data = await res.json();
    return data.secure_url;
  }

  // ============================================================
  // Firebase init
  // ============================================================
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const provider = new GoogleAuthProvider();

  // ============================================================
  // Small helpers
  // ============================================================
  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function debounce(fn, delay) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.toggle('toast-error', isError);
    toast.classList.add('show');
    clearTimeout(toast.__timer);
    toast.__timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ============================================================
  // Section configuration — drives every tab & field automatically.
  // Add/remove entries here to change what the dashboard controls.
  // ============================================================
  const SECTIONS = {
    popup: {
      label: 'Popup',
      toggle: { key: 'enabled', label: 'Show popup automatically when the site loads' },
      texts: [
        { key: 'eyebrow', label: 'Eyebrow Label', type: 'text' },
        { key: 'heading', label: 'Heading', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' },
        { key: 'ctaText', label: 'Button Text', type: 'text' }
      ],
      list: { key: 'slides', label: 'Popup Images', fields: [] }
    },
    hero: {
      label: 'Hero',
      texts: [
        { key: 'eyebrow', label: 'Eyebrow Label', type: 'text' },
        { key: 'title', label: 'Main Heading', type: 'text' },
        { key: 'subhead', label: 'Subheading', type: 'textarea' },
        { key: 'cta1Text', label: 'Primary Button Text', type: 'text' },
        { key: 'cta2Text', label: 'Secondary Button Text', type: 'text' }
      ],
      list: { key: 'slides', label: 'Hero Background Images', fields: [] }
    },
    thisWeek: {
      label: "This Week At PV",
      texts: [
        { key: 'eyebrow', label: 'Eyebrow Label', type: 'text' },
        { key: 'heading', label: 'Heading', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' }
      ],
      list: {
        key: 'slides', label: 'Event Cards',
        fields: [
          { key: 'day', label: 'Day (e.g. Friday)', type: 'text' },
          { key: 'name', label: 'Event Name', type: 'text' }
        ]
      }
    },
    experience: {
      label: 'Experience',
      texts: [
        { key: 'eyebrow', label: 'Eyebrow Label', type: 'text' },
        { key: 'heading', label: 'Heading', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' }
      ],
      list: {
        key: 'cards', label: 'Experience Cards',
        fields: [
          { key: 'day', label: 'Day Tag (e.g. Fri)', type: 'text' },
          { key: 'title', label: 'Title', type: 'text' },
          { key: 'desc', label: 'Description', type: 'textarea' }
        ]
      }
    },
    ourMenu: {
      label: 'Our Menu',
      texts: [
        { key: 'eyebrow', label: 'Eyebrow Label', type: 'text' },
        { key: 'heading', label: 'Heading', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' }
      ],
      list: {
        key: 'slides', label: 'Menu Categories',
        fields: [
          { key: 'label', label: 'Category Label (e.g. Category)', type: 'text' },
          { key: 'name', label: 'Category Name', type: 'text' }
        ]
      }
    },
    kitchen: {
      label: 'Kitchen Gallery',
      texts: [
        { key: 'eyebrow', label: 'Eyebrow Label', type: 'text' },
        { key: 'heading', label: 'Heading', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' },
        { key: 'quote', label: 'Quote', type: 'textarea' }
      ],

        key: 'images', label: 'Gallery Images',
        fields: [ { key: 'title', label: 'Image Title', type: 'text' } ]
      }
    },
    atmosphere: {
      label: 'Atmosphere Gallery',
      texts: [

        { key: 'heading', label: 'Heading', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' }
      ],

        key: 'images', label: 'Gallery Images',
        fields: [ { key: 'title', label: 'Image Title', type: 'text' } ]
      }
    },
    visit: {
      label: 'Visit & Reserve',
      texts: [
        { key: 'eyebrow', label: 'Eyebrow Label', type: 'text' },
        { key: 'heading', label: 'Heading', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' },
        { key: 'quote', label: 'Quote', type: 'textarea' }
      ],
      list: {
        key: 'images', label: 'Visit Gallery / Backgrounds',
        fields: [ { key: 'title', label: 'Image Title', type: 'text' } ]
      }
    },
    footer: {
      label: 'Footer',
      texts: [
        { key: 'heading', label: 'Heading / Title', type: 'text' },
        { key: 'subheading', label: 'Subheading', type: 'textarea' },
        { key: 'brandText', label: 'About Text', type: 'textarea' },
        { key: 'tagline', label: 'Tagline', type: 'text' }
      ],
      list: {
        key: 'images', label: 'Footer Logos / Images',
        fields: [ { key: 'title', label: 'Title', type: 'text' } ]
      }
    }
  };

  // ============================================================
  // Generic field binder — text input/textarea <-> Firebase path
  // ============================================================
  function bindText(dbPath, field) {
    const wrapper = el('div', { class: 'field' });
    const label = el('label', { class: 'field-label', text: field.label });
    const input = field.type === 'textarea'
      ? el('textarea', { rows: '3', class: 'field-input' })
      : el('input', { type: 'text', class: 'field-input' });

    onValue(ref(db, dbPath), (snap) => {
      if (document.activeElement === input) return;
      input.value = snap.val() ?? '';
    });

    const save = debounce(() => {
      set(ref(db, dbPath), input.value)
        .then(() => showToast('Saved'))
        .catch(() => showToast('Save failed — check your connection', true));
    }, 600);
    input.addEventListener('input', save);

    wrapper.appendChild(label);
    wrapper.appendChild(input);
    return wrapper;
  }

  // ============================================================
  // Generic toggle binder — checkbox <-> Firebase boolean
  // ============================================================
  function bindToggle(dbPath, cfg) {
    const wrapper = el('label', { class: 'toggle-row' });
    const input = el('input', { type: 'checkbox' });

    onValue(ref(db, dbPath), (snap) => {
      input.checked = snap.val() !== false; // defaults to ON until admin turns it off
    });
    input.addEventListener('change', () => {
      set(ref(db, dbPath), input.checked).then(() => showToast('Saved'));
    });

    wrapper.appendChild(input);
    wrapper.appendChild(el('span', { text: cfg.label }));
    return wrapper;
  }

  // ============================================================
  // Generic image-list manager — grid of images with optional
  // per-item text fields, add/delete/reorder, Cloudinary upload.
  // ============================================================
  function bindList(sectionKey, listCfg) {
    const dbPath = `content/${sectionKey}/${listCfg.key}`;
    const wrapper = el('div', { class: 'list-manager' });
    const header = el('div', { class: 'list-manager-header' }, [
      el('h4', { text: listCfg.label }),
      el('p', { class: 'list-hint', text: 'If this list is empty, the site keeps showing its original default images for this section. Add an image here to take over.' })
    ]);
    const grid = el('div', { class: 'image-grid' });
    const fileInput = el('input', { type: 'file', accept: 'image/*', multiple: 'multiple', class: 'hidden-file-input' });
    const addBtn = el('button', { type: 'button', class: 'btn-add', text: '+ Add Image', onclick: () => fileInput.click() });

    fileInput.addEventListener('change', async () => {
      const files = Array.from(fileInput.files || []);
      fileInput.value = '';
      for (const file of files) {
        showToast('Uploading image…');
        try {
          const url = await uploadToCloudinary(file);
          const existing = grid.__items || [];
          const nextOrder = existing.length ? Math.max(...existing.map(i => i.order ?? 0)) + 1 : 0;
          const defaults = {};
          (listCfg.fields || []).forEach(f => { defaults[f.key] = ''; });
          await push(ref(db, dbPath), { url, order: nextOrder, ...defaults });
          showToast('Image added');
        } catch (e) {
          showToast('Upload failed', true);
        }
      }
    });

    let isEditing = false;
    grid.addEventListener('focusin', () => { isEditing = true; });
    grid.addEventListener('focusout', () => { isEditing = false; });

    function renderGrid(items) {
      grid.innerHTML = '';
      if (!items.length) {
        grid.appendChild(el('p', { class: 'empty-state', text: 'No images added yet — click "+ Add Image" to start.' }));
        return;
      }
      items.forEach((item, idx) => {
        const card = el('div', { class: 'image-card' });
        card.appendChild(el('img', { src: item.url, class: 'image-thumb', alt: 'uploaded image' }));

        const fieldsWrap = el('div', { class: 'image-card-fields' });
        (listCfg.fields || []).forEach(f => {
          const input = f.type === 'textarea'
            ? el('textarea', { rows: '2', class: 'field-input small', placeholder: f.label })
            : el('input', { type: 'text', class: 'field-input small', placeholder: f.label });
          input.value = item[f.key] ?? '';
          const saveField = debounce(() => {
            update(ref(db, `${dbPath}/${item.key}`), { [f.key]: input.value }).then(() => showToast('Saved'));
          }, 600);
          input.addEventListener('input', saveField);
          fieldsWrap.appendChild(input);
        });
        card.appendChild(fieldsWrap);

        const actions = el('div', { class: 'image-card-actions' });
        const upBtn = el('button', { type: 'button', class: 'icon-btn', title: 'Move earlier', text: '↑', onclick: () => moveItem(items, idx, -1) });
        const downBtn = el('button', { type: 'button', class: 'icon-btn', title: 'Move later', text: '↓', onclick: () => moveItem(items, idx, 1) });
        const delBtn = el('button', {
          type: 'button', class: 'icon-btn danger', title: 'Delete', text: '✕',
          onclick: () => {
            if (confirm('Delete this image? This cannot be undone.')) {
              remove(ref(db, `${dbPath}/${item.key}`)).then(() => showToast('Deleted'));
            }
          }
        });
        if (idx === 0) upBtn.disabled = true;
        if (idx === items.length - 1) downBtn.disabled = true;
        actions.appendChild(upBtn);
        actions.appendChild(downBtn);
        actions.appendChild(delBtn);
        card.appendChild(actions);

        grid.appendChild(card);
      });
    }

    function moveItem(items, idx, dir) {
      const current = items[idx];
      const other = items[idx + dir];
      if (!other) return;
      const updates = {};
      updates[`${dbPath}/${current.key}/order`] = other.order ?? 0;
      updates[`${dbPath}/${other.key}/order`] = current.order ?? 0;
      update(ref(db), updates).then(() => showToast('Reordered'));
    }

    onValue(ref(db, dbPath), (snap) => {
      if (isEditing) return;
      const data = snap.val();
      const items = data
        ? Object.keys(data).map(key => ({ key, ...data[key] })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
        : [];
      grid.__items = items;
      renderGrid(items);
    });

    wrapper.appendChild(header);
    wrapper.appendChild(addBtn);
    wrapper.appendChild(fileInput);
    wrapper.appendChild(grid);
    return wrapper;
  }

  // ============================================================
  // Panel + sidebar builders
  // ============================================================
  function buildSectionPanel(key, cfg) {
    const panel = el('section', { class: 'panel', id: `panel-${key}` });
    panel.appendChild(el('h2', { class: 'panel-title font-display', text: cfg.label }));
    if (cfg.toggle) panel.appendChild(bindToggle(`content/${key}/${cfg.toggle.key}`, cfg.toggle));
    (cfg.texts || []).forEach(field => panel.appendChild(bindText(`content/${key}/${field.key}`, field)));
    if (cfg.list) panel.appendChild(bindList(key, cfg.list));
    return panel;
  }

  function switchTab(key) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${key}`));
  }

  let dashboardBuilt = false;
  function buildDashboard() {
    if (dashboardBuilt) return;
    dashboardBuilt = true;
    const nav = document.getElementById('sidebarNav');
    const main = document.getElementById('panelsContainer');
    Object.entries(SECTIONS).forEach(([key, cfg], i) => {
      const btn = el('button', { type: 'button', class: 'tab-btn' + (i === 0 ? ' active' : ''), text: cfg.label, onclick: () => switchTab(key) });
      btn.dataset.key = key;
      nav.appendChild(btn);

      const panel = buildSectionPanel(key, cfg);
      if (i === 0) panel.classList.add('active');
      main.appendChild(panel);
    });
  }

  // ============================================================
  // Auth
  // ============================================================
  document.getElementById('googleSignInBtn').addEventListener('click', () => {
    signInWithPopup(auth, provider).catch(err => showToast('Sign-in failed: ' + err.message, true));
  });
  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');
    const loginError = document.getElementById('loginError');

    if (user) {
      const email = (user.email || '').toLowerCase();
      const allowed = ADMIN_EMAILS.map(e => e.toLowerCase()).includes(email);
      if (!allowed) {
        loginError.textContent = `${user.email} is not authorized for admin access. Ask the site owner to add this email to ADMIN_EMAILS.`;
        loginError.classList.remove('hidden');
        signOut(auth);
        return;
      }
      loginError.classList.add('hidden');
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      document.getElementById('userEmail').textContent = user.email;
      buildDashboard();
    } else {
      dashboard.classList.add('hidden');
      loginScreen.classList.remove('hidden');
    }
  });
</script>
</body>
</html>
