<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV Lifestyle — Admin Dashboard</title>
<link rel="icon" type="image/png" href="https://i.postimg.cc/DZh18dK7/pvlogo-removebg-preview.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">

<style>
  :root{
    --orange:#e18a3f;
    --orange-light:#f3a663;
    --orange-dark:#b96a26;
    --orange-sat:#e87f1c;
    --charcoal:#3f4749;
    --charcoal-sat:#2c4247;
    --charcoal-deep:#262b2c;
    --charcoal-deeper:#181b1c;
    --gray:#9aa3a3;
    --cream:#f7f2ea;
    --white:#ffffff;
    --danger:#c0392b;
    --success:#27ae60;
    --border:rgba(247,242,234,.12);
    --shadow:0 20px 40px -12px rgba(0,0,0,.45);
    --shadow-sm:0 8px 20px -8px rgba(0,0,0,.35);
    --shadow-orange:0 12px 24px -10px rgba(225,138,63,.4);
    --transition:all .35s cubic-bezier(.22,.8,.25,1);
  }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; }
  body{
    font-family:'Manrope', system-ui, sans-serif;
    background:var(--charcoal-deeper);
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .font-display{ font-family:'Bebas Neue', sans-serif; letter-spacing:.02em; }
  .font-quote{ font-family:'Cormorant Garamond', serif; font-style:italic; }
  .hidden{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  input,textarea,select{ font-family:inherit; outline:none; }
  img{ max-width:100%; display:block; }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(20px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes slideInLeft{ from{ opacity:0; transform:translateX(-20px); } to{ opacity:1; transform:translateX(0); } }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.05); } }
  @keyframes shimmer{ 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .animate-fade-in{ animation:fadeIn .5s ease both; }
  .animate-fade-up{ animation:fadeInUp .5s ease both; }
  .stagger-1{ animation-delay:.05s; }
  .stagger-2{ animation-delay:.12s; }
  .stagger-3{ animation-delay:.19s; }
  .stagger-4{ animation-delay:.26s; }
  .stagger-5{ animation-delay:.33s; }

  /* ===== LOGIN SCREEN ===== */
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--charcoal-deeper); position:relative; overflow:hidden;
    padding:1.5rem;
  }
  #loginScreen::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 30% 20%, rgba(225,138,63,.08) 0%, transparent 50%),
               radial-gradient(circle at 70% 80%, rgba(225,138,63,.05) 0%, transparent 50%);
  }
  .login-card{
    background:var(--charcoal-deep); border-radius:24px; padding:clamp(2.5rem,5vw,3.5rem);
    max-width:420px; width:100%; text-align:center; position:relative; z-index:1;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    animation:fadeInUp .7s cubic-bezier(.22,.8,.25,1) both;
  }
  .login-card .brand-chip{
    display:inline-flex; align-items:center; justify-content:center;
    margin-bottom:1.5rem;
  }
  .login-card .brand-chip img{ height:66px; filter:brightness(0) invert(1); }
  .login-card h1{ font-size:2.2rem; color:var(--cream); letter-spacing:.02em; }
  .login-card p{ color:var(--gray); font-size:.9rem; margin-top:.5rem; margin-bottom:2rem; line-height:1.6; }
  .google-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.65rem;
    width:100%; background:var(--cream); color:var(--charcoal-deeper);
    border:none; border-radius:999px;
    padding:1rem 1.5rem; font-weight:800; font-size:.95rem; letter-spacing:.01em;
    transition:var(--transition);
    box-shadow:0 8px 20px -8px rgba(247,242,234,.2);
  }
  .google-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 28px -8px rgba(247,242,234,.3); }
  .google-btn:active{ transform:translateY(0); }
  .login-error{
    margin-top:1.25rem; background:rgba(192,57,43,.12); color:var(--danger);
    border:1px solid rgba(192,57,43,.3); border-radius:12px; padding:1rem 1.2rem;
    font-size:.85rem; text-align:left; line-height:1.5; animation:fadeIn .3s ease;
  }

  /* ===== DASHBOARD SHELL ===== */
  #dashboard{ display:flex; min-height:100vh; opacity:0; animation:fadeIn .4s ease .1s both; }

  .sidebar{
    width:280px; flex-shrink:0; background:var(--charcoal-deeper);
    display:flex; flex-direction:column; position:fixed; left:0; top:0; height:100vh;
    border-right:1px solid var(--border); z-index:50;
    transition:transform .35s ease;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:.75rem; padding:1.5rem 1.5rem 1.25rem;
    border-bottom:1px solid var(--border);
  }
  .sidebar-brand .brand-chip{
    display:inline-flex; align-items:center;
  }
  .sidebar-brand .brand-chip img{ height:51px; filter:brightness(0) invert(1); }
  .sidebar-brand span{ font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:.04em; color:var(--cream); }
  .sidebar-brand .badge{
    margin-left:auto; background:var(--orange); color:var(--charcoal-deeper);
    font-size:.65rem; font-weight:800; padding:.25rem .6rem; border-radius:999px;
    text-transform:uppercase; letter-spacing:.08em;
  }

  #sidebarNav{ display:flex; flex-direction:column; padding:1rem .75rem; gap:.35rem; overflow-y:auto; flex:1; }
  .tab-btn{
    text-align:left; background:none; border:none; color:rgba(247,242,234,.55);
    padding:.85rem 1.1rem; border-radius:999px; font-weight:700; font-size:.88rem;
    transition:var(--transition); position:relative; overflow:hidden;
    display:flex; align-items:center; gap:.65rem;
  }
  .tab-btn::before{
    content:''; position:absolute; inset:0; background:var(--orange);
    border-radius:999px; transform:scaleX(0); transform-origin:left;
    transition:transform .35s cubic-bezier(.22,.8,.25,1); z-index:0; opacity:.15;
  }
  .tab-btn:hover{ color:var(--cream); background:rgba(247,242,234,.05); }
  .tab-btn:hover::before{ transform:scaleX(1); }
  .tab-btn.active{ background:var(--orange); color:var(--charcoal-deeper); box-shadow:var(--shadow-orange); }
  .tab-btn.active::before{ display:none; }
  .tab-btn span{ position:relative; z-index:1; }
  .tab-icon{ width:18px; height:18px; position:relative; z-index:1; opacity:.7; }
  .tab-btn.active .tab-icon{ opacity:1; }

  /* ===== NAV GROUP (Home Page collapsible) ===== */
  .nav-group{ display:flex; flex-direction:column; }
  .nav-group-toggle{ width:100%; }
  .nav-chevron{
    margin-left:auto; width:16px; height:16px; position:relative; z-index:1;
    opacity:.55; transition:transform .3s cubic-bezier(.22,.8,.25,1);
  }
  .nav-group-toggle.expanded .nav-chevron{ transform:rotate(180deg); }
  .nav-group-toggle.has-active-child{ color:var(--orange-light); background:rgba(225,138,63,.1); }
  .nav-group-toggle.has-active-child .tab-icon{ opacity:1; }
  .nav-subgroup{
    display:flex; flex-direction:column; gap:.2rem; overflow:hidden;
    max-height:0; opacity:0; margin:0 0 0 0;
    transition:max-height .35s cubic-bezier(.22,.8,.25,1), opacity .3s ease, margin .3s ease;
  }
  .nav-subgroup.expanded{ max-height:600px; opacity:1; margin:.3rem 0 .2rem; }
  .sub-tab-btn{
    padding:.65rem 1.1rem .65rem 2.6rem; font-size:.82rem; font-weight:600;
  }
  .sub-tab-btn .tab-icon{ width:15px; height:15px; }

  .sidebar-footer{ padding:1.25rem; border-top:1px solid var(--border); }
  .sidebar-footer .user-row{ display:flex; align-items:center; gap:.75rem; margin-bottom:1rem; }
  .user-avatar{
    width:36px; height:36px; border-radius:50%; background:var(--orange);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.85rem; color:var(--charcoal-deeper); flex-shrink:0;
  }
  .user-email{ font-size:.75rem; color:rgba(247,242,234,.5); word-break:break-all; line-height:1.4; }
  .btn-logout{
    width:100%; background:rgba(247,242,234,.06); color:var(--cream);
    border:1px solid var(--border); border-radius:999px;
    padding:.65rem; font-weight:700; font-size:.82rem;
    transition:var(--transition); display:flex; align-items:center; justify-content:center; gap:.4rem;
  }
  .btn-logout:hover{ background:var(--danger); border-color:var(--danger); transform:translateY(-1px); }

  .main-area{ flex:1; min-width:0; margin-left:280px; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:1.25rem clamp(1.25rem,3vw,2.5rem);
    background:rgba(24,27,28,.85); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:40;
  }
  .topbar h1{ font-size:1.15rem; font-weight:800; color:var(--cream); display:flex; align-items:center; gap:.6rem; }
  .topbar h1 .live-dot{
    width:8px; height:8px; border-radius:50%; background:var(--success);
    box-shadow:0 0 8px var(--success); animation:pulse 2s ease infinite;
  }
  .topbar-actions{ display:flex; align-items:center; gap:.6rem; }
  .btn-view-site{
    display:inline-flex; align-items:center; gap:.4rem; background:var(--orange); color:var(--charcoal-deeper);
    padding:.6rem 1.2rem; border-radius:999px; font-weight:800; font-size:.82rem;
    transition:var(--transition); box-shadow:var(--shadow-orange);
  }
  .btn-view-site:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -10px rgba(225,138,63,.6); }
  .btn-view-site:active{ transform:translateY(0); }

  #panelsContainer{ padding:clamp(1.5rem,3vw,2.5rem); max-width:1100px; }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fadeInUp .4s ease both; }
  .panel-title{ font-size:2.2rem; margin-bottom:.25rem; color:var(--cream); letter-spacing:.02em; }
  .panel-subtitle{ color:var(--gray); font-size:.9rem; margin-bottom:2rem; }

  /* ===== SECTION CARDS ===== */
  .section-card{
    background:var(--charcoal-deep); border:1px solid var(--border); border-radius:20px;
    padding:clamp(1.5rem,2.5vw,2.25rem); margin-bottom:1.5rem;
    box-shadow:var(--shadow-sm); transition:var(--transition);
    animation:fadeInUp .5s ease both;
  }
  .section-card:hover{ border-color:rgba(225,138,63,.2); }
  .section-card-header{
    display:flex; align-items:center; gap:.6rem; margin-bottom:1.5rem;
    padding-bottom:1rem; border-bottom:1px solid var(--border);
  }
  .section-card-header h3{ font-size:1.05rem; font-weight:800; color:var(--cream); text-transform:uppercase; letter-spacing:.08em; }
  .section-card-header .count-badge{
    background:var(--orange); color:var(--charcoal-deeper); font-size:.7rem; font-weight:800;
    padding:.2rem .55rem; border-radius:999px; margin-left:auto;
  }
  .event-card-controls{ display:flex; gap:.4rem; margin-left:auto; }
  .event-card-controls .pill-btn{ flex:0 0 auto; width:36px; padding:0; }
  .event-card + .event-card{ margin-top:1.5rem; }

  /* ===== TEXT FIELDS ===== */
  .field-group{ margin-bottom:1.25rem; }
  .field-group:last-child{ margin-bottom:0; }
  .field-label{
    display:flex; align-items:center; gap:.5rem;
    font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--orange-light); margin-bottom:.6rem;
  }
  .field-label .required{ color:var(--orange); font-size:.9rem; }
  .field-input{
    width:100%; background:rgba(247,242,234,.04); border:1.5px solid var(--border);
    border-radius:14px; padding:.85rem 1.1rem; font-size:.92rem; color:var(--cream);
    transition:var(--transition); resize:vertical;
  }
  .field-input::placeholder{ color:rgba(247,242,234,.25); }
  .field-input:hover{ border-color:rgba(247,242,234,.2); }
  .field-input:focus{ border-color:var(--orange); background:rgba(225,138,63,.06); box-shadow:0 0 0 3px rgba(225,138,63,.1); }
  .field-input.small{ font-size:.85rem; padding:.65rem .85rem; border-radius:12px; }
  textarea.field-input{ min-height:90px; line-height:1.5; }

  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  @media (max-width:640px){ .field-row{ grid-template-columns:1fr; } }

  .field-hint{
    font-size:.78rem; color:var(--gray); margin-top:.4rem; display:flex; align-items:center; gap:.35rem;
  }
  .field-hint svg{ width:14px; height:14px; flex-shrink:0; }

  /* ===== TOGGLE ===== */
  .toggle-wrap{ display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; padding:1rem 1.25rem; background:rgba(247,242,234,.03); border-radius:14px; border:1px solid var(--border); }
  .toggle-switch{ position:relative; width:52px; height:28px; flex-shrink:0; }
  .toggle-switch input{ opacity:0; width:0; height:0; }
  .toggle-slider{
    position:absolute; inset:0; background:var(--charcoal); border-radius:999px;
    transition:var(--transition); cursor:pointer; border:1.5px solid var(--border);
  }
  .toggle-slider::before{
    content:''; position:absolute; height:20px; width:20px; left:3px; top:50%; transform:translateY(-50%);
    background:var(--cream); border-radius:50%; transition:var(--transition); box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .toggle-switch input:checked + .toggle-slider{ background:var(--orange); border-color:var(--orange); }
  .toggle-switch input:checked + .toggle-slider::before{ left:calc(100% - 23px); }
  .toggle-label{ font-weight:700; font-size:.9rem; color:var(--cream); }
  .toggle-status{ font-size:.78rem; color:var(--gray); margin-left:auto; }

  /* ===== IMAGE GRID ===== */
  .image-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:1rem; }
  .empty-state{
    grid-column:1/-1; padding:2.5rem; text-align:center;
    border:2px dashed rgba(247,242,234,.1); border-radius:16px; color:var(--gray);
    font-size:.9rem; animation:fadeIn .4s ease;
  }
  .empty-state svg{ margin-bottom:.75rem; opacity:.5; }

  .image-card{
    background:var(--charcoal-deeper); border:1.5px solid var(--border); border-radius:16px;
    overflow:hidden; display:flex; flex-direction:column;
    transition:var(--transition); position:relative;
    animation:fadeInUp .4s ease both;
  }
  .image-card:hover{ transform:translateY(-4px); border-color:rgba(225,138,63,.25); box-shadow:0 15px 30px -10px rgba(0,0,0,.4); }
  .image-card:hover .image-thumb{ transform:scale(1.05); }
  .image-card:hover .image-overlay{ opacity:1; }

  .image-thumb-wrap{ position:relative; overflow:hidden; aspect-ratio:4/3; background:var(--charcoal-deep); }
  .image-thumb{ width:100%; height:100%; object-fit:cover; transition:transform .6s ease; }
  .image-overlay{
    position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(24,27,28,.85) 100%);
    opacity:0; transition:opacity .3s ease; display:flex; align-items:flex-end; padding:1rem;
  }
  .image-overlay .img-index{
    background:var(--orange); color:var(--charcoal-deeper); font-size:.7rem; font-weight:800;
    padding:.25rem .55rem; border-radius:999px;
  }

  .image-card-fields{ padding:.75rem; display:flex; flex-direction:column; gap:.5rem; }
  .image-card-actions{ display:flex; gap:.4rem; padding:0 .75rem .75rem; margin-top:auto; }

  .pill-btn{
    flex:1; display:inline-flex; align-items:center; justify-content:center; gap:.35rem;
    background:rgba(247,242,234,.06); color:var(--cream); border:1px solid var(--border);
    border-radius:999px; padding:.5rem; font-weight:700; font-size:.8rem;
    transition:var(--transition); min-height:36px;
  }
  .pill-btn:hover:not(:disabled){ background:var(--orange); color:var(--charcoal-deeper); border-color:var(--orange); transform:translateY(-1px); }
  .pill-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .pill-btn.danger:hover{ background:var(--danger); color:var(--white); border-color:var(--danger); }
  .pill-btn svg{ width:14px; height:14px; }

  .add-image-btn{
    display:inline-flex; align-items:center; gap:.5rem;
    background:var(--orange); color:var(--charcoal-deeper); border:none; border-radius:999px;
    padding:.75rem 1.4rem; font-weight:800; font-size:.85rem; letter-spacing:.01em;
    transition:var(--transition); box-shadow:var(--shadow-orange); margin-bottom:1.25rem;
  }
  .add-image-btn:hover{ transform:translateY(-2px); box-shadow:0 16px 30px -10px rgba(225,138,63,.6); }
  .add-image-btn:active{ transform:translateY(0); }
  .add-image-btn .plus{ font-size:1.1rem; line-height:1; }

  .hidden-file-input{ display:none; }

  /* ===== STATUS INDICATORS ===== */
  .save-status{
    display:inline-flex; align-items:center; gap:.4rem;
    font-size:.78rem; font-weight:700; padding:.4rem .85rem; border-radius:999px;
    transition:var(--transition); opacity:0; transform:translateY(4px);
  }
  .save-status.show{ opacity:1; transform:translateY(0); }
  .save-status.saved{ background:rgba(39,174,96,.15); color:var(--success); border:1px solid rgba(39,174,96,.25); }
  .save-status.saving{ background:rgba(225,138,63,.15); color:var(--orange-light); border:1px solid rgba(225,138,63,.25); }
  .save-status.error{ background:rgba(192,57,43,.15); color:var(--danger); border:1px solid rgba(192,57,43,.25); }

  /* ===== SKELETON ===== */
  .skeleton{
    background:linear-gradient(90deg, rgba(247,242,234,.05) 25%, rgba(247,242,234,.1) 50%, rgba(247,242,234,.05) 75%);
    background-size:200% 100%; animation:shimmer 1.5s ease infinite;
    border-radius:12px;
  }

  /* ===== TOAST ===== */
  #toast{
    position:fixed; bottom:1.5rem; right:1.5rem; transform:translateY(20px);
    background:var(--charcoal-deep); color:var(--cream); padding:1rem 1.5rem; border-radius:16px;
    font-size:.88rem; font-weight:700; opacity:0; pointer-events:none; transition:var(--transition);
    z-index:100; box-shadow:var(--shadow); border:1px solid var(--border); display:flex; align-items:center; gap:.6rem;
    max-width:380px;
  }
  #toast.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  #toast.toast-error{ border-color:rgba(192,57,43,.4); background:rgba(192,57,43,.12); color:#ff9f9f; }
  #toast.toast-success{ border-color:rgba(39,174,96,.4); background:rgba(39,174,96,.12); color:#7ee3a0; }
  #toast svg{ width:18px; height:18px; flex-shrink:0; }

  /* ===== MOBILE SIDEBAR ===== */
  .mobile-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:45; opacity:0; visibility:hidden;
    transition:opacity .3s ease, visibility 0s .3s;
  }
  .mobile-overlay.open{ opacity:1; visibility:visible; transition:opacity .3s ease; }
  .mobile-menu-btn{
    display:none; width:40px; height:40px; border-radius:10px;
    background:rgba(247,242,234,.06); border:1px solid var(--border);
    align-items:center; justify-content:center; color:var(--cream);
  }
  .mobile-menu-btn:hover{ background:rgba(247,242,234,.1); }

  @media (max-width:900px){
    .sidebar{ transform:translateX(-100%); }
    .sidebar.open{ transform:translateX(0); }
    .main-area{ margin-left:0; }
    .mobile-menu-btn{ display:flex; }
    .image-grid{ grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); }
  }
  @media (max-width:640px){
    .field-row{ grid-template-columns:1fr; }
    .image-grid{ grid-template-columns:repeat(2,1fr); }
    .topbar{ padding:1rem; }
    .topbar h1{ font-size:1rem; }
    .panel-title{ font-size:1.6rem; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(247,242,234,.15); border-radius:999px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(247,242,234,.25); }

  /* Focus */
  :focus-visible{ outline:2px solid var(--orange); outline-offset:2px; border-radius:8px; }
</style>
<base target="_blank">
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="brand-chip">
      <img src="https://i.postimg.cc/DZh18dK7/pvlogo-removebg-preview.png" alt="PV Lifestyle logo">
    </div>
    <h1 class="font-display">Admin Dashboard</h1>

  async function initializeEventsDefaults() {
    const snap = await new Promise(res => onValue(ref(db, 'content/events'), res, { onlyOnce: true }));
    if (snap.exists()) return;
    for (const ev of DEFAULT_EVENTS) {
      const { images, ...rest } = ev;
      const newRef = push(ref(db, 'content/events'));
      await set(newRef, rest);
      for (const img of images) {
        await push(ref(db, `content/events/${newRef.key}/images`), img);
      }
    }
  }

  // ===== HELPERS =====
  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => {
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function debounce(fn, delay) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
  }

  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.innerHTML = isError
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ${message}`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> ${message}`;
    toast.className = isError ? 'toast-error' : 'toast-success';
    toast.classList.add('show');
    clearTimeout(toast.__timer);
    toast.__timer = setTimeout(() => toast.classList.remove('show'), 2800);
  }

  function showSaveStatus(el, status) {
    el.className = `save-status ${status}`;
    el.classList.add('show');
    clearTimeout(el.__timer);
    el.__timer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  async function uploadToCloudinary(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, {
      method: 'POST', body: formData
    });
    if (!res.ok) throw new Error('Upload failed');
    const data = await res.json();
    return data.secure_url;
  }

            if (items) {

            }
          }

      );
    });

  // ===== BUILDERS =====
  function bindText(dbPath, field, defaultValue) {
    const wrapper = el('div', { class: 'field-group' });
    const label = el('label', { class: 'field-label', text: field.label });
    const input = field.type === 'textarea'
      ? el('textarea', { rows: '3', class: 'field-input', placeholder: defaultValue || '' })
      : el('input', { type: 'text', class: 'field-input', placeholder: defaultValue || '' });
    const status = el('span', { class: 'save-status', text: 'Saved' });

    onValue(ref(db, dbPath), (snap) => {
      if (document.activeElement === input) return;
      const val = snap.val();
      input.value = val !== null && val !== undefined ? val : (defaultValue || '');
    });

    const save = debounce(() => {
      showSaveStatus(status, 'saving');
      status.textContent = 'Saving...';
      set(ref(db, dbPath), input.value)
        .then(() => { status.textContent = 'Saved'; showSaveStatus(status, 'saved'); showToast('Saved'); })
        .catch(() => { status.textContent = 'Error'; showSaveStatus(status, 'error'); showToast('Save failed', true); });
    }, 600);
    input.addEventListener('input', save);

    wrapper.appendChild(label);
    wrapper.appendChild(input);
    wrapper.appendChild(status);
    return wrapper;
  }

  function bindToggle(dbPath, cfg, defaultValue) {
    const wrapper = el('div', { class: 'toggle-wrap' });
    const switchWrap = el('label', { class: 'toggle-switch' });
    const input = el('input', { type: 'checkbox' });
    const slider = el('span', { class: 'toggle-slider' });
    const label = el('span', { class: 'toggle-label', text: cfg.label });
    const statusText = el('span', { class: 'toggle-status', text: 'Loading...' });

    onValue(ref(db, dbPath), (snap) => {
      const val = snap.val();
      const isEnabled = val !== undefined ? val : (defaultValue !== false);
      input.checked = isEnabled;
      statusText.textContent = isEnabled ? 'Active' : 'Hidden';
      statusText.style.color = isEnabled ? 'var(--success)' : 'var(--gray)';
    });

    input.addEventListener('change', () => {
      set(ref(db, dbPath), input.checked).then(() => {
        statusText.textContent = input.checked ? 'Active' : 'Hidden';
        statusText.style.color = input.checked ? 'var(--success)' : 'var(--gray)';
        showToast(input.checked ? 'Popup enabled' : 'Popup disabled');
      });
    });

    switchWrap.appendChild(input);
    switchWrap.appendChild(slider);
    wrapper.appendChild(switchWrap);
    wrapper.appendChild(label);
    wrapper.appendChild(statusText);
    return wrapper;
  }

  function bindList(sectionKey, listCfg, defaultItems) {
    const dbPath = `content/${sectionKey}/${listCfg.key}`;
    const wrapper = el('div', { class: 'section-card' });
    const header = el('div', { class: 'section-card-header' }, [
      el('h3', { text: listCfg.label }),
      el('span', { class: 'count-badge', text: '0', id: `count-${sectionKey}-${listCfg.key}` })
    ]);
    const grid = el('div', { class: 'image-grid' });
    const fileInput = el('input', { type: 'file', accept: 'image/*', multiple: 'multiple', class: 'hidden-file-input' });
    const addBtn = el('button', {
      type: 'button', class: 'add-image-btn',
      html: '<span class="plus">+</span> Add Image'
    });
    addBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      const files = Array.from(fileInput.files || []);
      fileInput.value = '';
      for (const file of files) {
        showToast('Uploading...');
        try {
          const url = await uploadToCloudinary(file);
          const existing = grid.__items || [];
          const nextOrder = existing.length ? Math.max(...existing.map(i => i.order ?? 0)) + 1 : 0;
          const defaults = {};
          (listCfg.fields || []).forEach(f => { defaults[f.key] = ''; });
          await push(ref(db, dbPath), { url, order: nextOrder, ...defaults });
          showToast('Image added');
        } catch (e) {
          showToast('Upload failed', true);
        }
      }
    });

    let isEditing = false;
    grid.addEventListener('focusin', () => { isEditing = true; });
    grid.addEventListener('focusout', () => { isEditing = false; });

    function renderGrid(items) {
      grid.innerHTML = '';
      const countBadge = document.getElementById(`count-${sectionKey}-${listCfg.key}`);
      if (countBadge) countBadge.textContent = items.length;

      if (!items.length) {
        grid.appendChild(el('div', { class: 'empty-state' }, [
          el('svg', { width: '48', height: '48', viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '1.5' }, [
            el('rect', { x: '3', y: '3', width: '18', height: '18', rx: '2' }),
            el('circle', { cx: '8.5', cy: '8.5', r: '1.5' }),
            el('path', { d: 'M21 15l-5-5L5 21' })
          ]),
          'No images yet. Click "+ Add Image" to upload.'
        ]));
        return;
      }

      items.forEach((item, idx) => {
        const card = el('div', { class: 'image-card', style: `animation-delay:${idx * 0.05}s` });

        const thumbWrap = el('div', { class: 'image-thumb-wrap' });
        thumbWrap.appendChild(el('img', { src: item.url, class: 'image-thumb', alt: 'uploaded' }));
        const overlay = el('div', { class: 'image-overlay' });
        overlay.appendChild(el('span', { class: 'img-index', text: `#${idx + 1}` }));
        thumbWrap.appendChild(overlay);
        card.appendChild(thumbWrap);

        const fieldsWrap = el('div', { class: 'image-card-fields' });
        (listCfg.fields || []).forEach(f => {
          const input = f.type === 'textarea'
            ? el('textarea', { rows: '2', class: 'field-input small', placeholder: f.label })
            : el('input', { type: 'text', class: 'field-input small', placeholder: f.label });
          input.value = item[f.key] ?? '';
          const saveField = debounce(() => {
            update(ref(db, `${dbPath}/${item.key}`), { [f.key]: input.value }).catch(() => {});
          }, 600);
          input.addEventListener('input', saveField);
          fieldsWrap.appendChild(input);
        });
        card.appendChild(fieldsWrap);

        const actions = el('div', { class: 'image-card-actions' });
        const upBtn = el('button', {
          type: 'button', class: 'pill-btn', title: 'Move earlier',
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
          onclick: () => moveItem(items, idx, -1)
        });
        const downBtn = el('button', {
          type: 'button', class: 'pill-btn', title: 'Move later',
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
          onclick: () => moveItem(items, idx, 1)
        });
        const delBtn = el('button', {
          type: 'button', class: 'pill-btn danger', title: 'Delete',
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
          onclick: () => {
            if (confirm('Delete this image?')) {
              remove(ref(db, `${dbPath}/${item.key}`)).then(() => showToast('Deleted'));
            }
          }
        });
        if (idx === 0) upBtn.disabled = true;
        if (idx === items.length - 1) downBtn.disabled = true;
        actions.appendChild(upBtn);
        actions.appendChild(downBtn);
        actions.appendChild(delBtn);
        card.appendChild(actions);

        grid.appendChild(card);
      });
    }

    function moveItem(items, idx, dir) {
      const current = items[idx];
      const other = items[idx + dir];
      if (!other) return;
      const updates = {};
      updates[`${dbPath}/${current.key}/order`] = other.order ?? 0;
      updates[`${dbPath}/${other.key}/order`] = current.order ?? 0;
      update(ref(db), updates).then(() => showToast('Reordered'));
    }

    onValue(ref(db, dbPath), (snap) => {
      if (isEditing) return;
      const data = snap.val();
      const items = data
        ? Object.keys(data).map(key => ({ key, ...data[key] })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
        : [];
      grid.__items = items;
      renderGrid(items);
    });

    wrapper.appendChild(header);
    wrapper.appendChild(addBtn);
    wrapper.appendChild(fileInput);
    wrapper.appendChild(grid);
    return wrapper;
  }

      const current = items[idx];
      const other = items[idx + dir];
      if (!other) return;
      const updates = {};
      updates[`${dbPath}/${current.key}/order`] = other.order ?? 0;
      updates[`${dbPath}/${other.key}/order`] = current.order ?? 0;
      update(ref(db), updates).then(() => showToast('Reordered'));
    }

    function renderGrid(items) {
      grid.innerHTML = '';
      const badge = document.getElementById(`count-events-${eventKey}`);
      if (badge) badge.textContent = items.length;
      if (!items.length) {
        grid.appendChild(el('div', { class: 'empty-state' }, ['No posters yet. Click "+ Add Poster Image" to upload.']));
        return;
      }
      items.forEach((item, idx) => {
        const card = el('div', { class: 'image-card' });
        const thumbWrap = el('div', { class: 'image-thumb-wrap' });
        thumbWrap.appendChild(el('img', { src: item.url, class: 'image-thumb', alt: 'poster' }));
        const overlay = el('div', { class: 'image-overlay' });
        overlay.appendChild(el('span', { class: 'img-index', text: `#${idx + 1}` }));
        thumbWrap.appendChild(overlay);
        card.appendChild(thumbWrap);

        const actions = el('div', { class: 'image-card-actions', style: 'padding:.75rem;' });
        const upBtn = el('button', {
          type: 'button', class: 'pill-btn', title: 'Move earlier',
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
          onclick: () => moveImg(items, idx, -1)
        });
        const downBtn = el('button', {
          type: 'button', class: 'pill-btn', title: 'Move later',
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
          onclick: () => moveImg(items, idx, 1)
        });
        const delBtn = el('button', {
          type: 'button', class: 'pill-btn danger', title: 'Delete',
          html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
          onclick: () => {
            if (confirm('Delete this poster image?')) {
              remove(ref(db, `${dbPath}/${item.key}`)).then(() => showToast('Deleted'));
            }
          }
        });
        if (idx === 0) upBtn.disabled = true;
        if (idx === items.length - 1) downBtn.disabled = true;
        actions.appendChild(upBtn);
        actions.appendChild(downBtn);
        actions.appendChild(delBtn);
        card.appendChild(actions);
        grid.appendChild(card);
      });
    }

    onValue(ref(db, dbPath), (snap) => {
      if (galleryEditing) return;
      const data = snap.val();
      const items = data
        ? Object.keys(data).map(k => ({ key: k, ...data[k] })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
        : [];
      grid.__items = items;
      renderGrid(items);
    });

    wrapper.appendChild(header);
    wrapper.appendChild(addBtn);
    wrapper.appendChild(fileInput);
    wrapper.appendChild(grid);
    return wrapper;
  }

  function buildEventsPanel(key, cfg) {
    const panel = el('section', { class: 'panel', id: `panel-${key}` });
    panel.appendChild(el('h2', { class: 'panel-title font-display', text: cfg.label }));
    panel.appendChild(el('p', { class: 'panel-subtitle', text: 'Add, edit, reorder and remove events — weekly residencies or one-off special guests. Changes appear instantly on the live Events page.' }));

    const addBtn = el('button', { type: 'button', class: 'add-image-btn', html: '<span class="plus">+</span> Add Event' });
    const list = el('div', { id: 'eventsList' });

    let panelEditing = false;
    panel.addEventListener('focusin', () => { panelEditing = true; });
    panel.addEventListener('focusout', () => { panelEditing = false; });

    addBtn.addEventListener('click', () => {
      const existing = list.__events || [];
      const nextOrder = existing.length ? Math.max(...existing.map(e => e.order ?? 0)) + 1 : 0;
      push(ref(db, 'content/events'), {
        title: 'New Event', tagLabel: 'Weekly Series', day: 'Friday',
        mode: 'recurring', recurring: 5, startHour: 20, startMin: 0, fixedDate: '',
        desc: '', order: nextOrder
      }).then(() => showToast('Event added'));
    });

    function moveEvent(idx, dir) {
      const events = list.__events || [];
      const current = events[idx];
      const other = events[idx + dir];
      if (!current || !other) return;
      const updates = {};
      updates[`content/events/${current.key}/order`] = other.order ?? 0;
      updates[`content/events/${other.key}/order`] = current.order ?? 0;
      update(ref(db), updates).then(() => showToast('Reordered'));
    }

    function buildEventCard(ev, idx, total) {
      const card = el('div', { class: 'section-card event-card' });

      const header = el('div', { class: 'section-card-header' }, [
        el('h3', { text: ev.title || 'Untitled Event' })
      ]);
      const controls = el('div', { class: 'event-card-controls' });
      const upBtn = el('button', {
        type: 'button', class: 'pill-btn', title: 'Move earlier',
        html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
        onclick: () => moveEvent(idx, -1)
      });
      const downBtn = el('button', {
        type: 'button', class: 'pill-btn', title: 'Move later',
        html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
        onclick: () => moveEvent(idx, 1)
      });
      const delBtn = el('button', {
        type: 'button', class: 'pill-btn danger', title: 'Delete event',
        html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>',
        onclick: () => {
          if (confirm(`Delete "${ev.title}"? This removes it from the live site immediately.`)) {
            remove(ref(db, `content/events/${ev.key}`)).then(() => showToast('Event deleted'));
          }
        }
      });
      if (idx === 0) upBtn.disabled = true;
      if (idx === total - 1) downBtn.disabled = true;
      controls.appendChild(upBtn);
      controls.appendChild(downBtn);
      controls.appendChild(delBtn);
      header.appendChild(controls);
      card.appendChild(header);

      const row1 = el('div', { class: 'field-row' });
      row1.appendChild(bindEventText(ev.key, 'title', 'Event Title', ev.title));
      row1.appendChild(bindEventSelect(ev.key, 'tagLabel', 'Category', ev.tagLabel, [
        { value: 'Weekly Series', label: 'Weekly Series' },
        { value: 'Special Guest', label: 'Special Guest' }
      ]));
      card.appendChild(row1);

      const row2 = el('div', { class: 'field-row' });
      row2.appendChild(bindEventText(ev.key, 'day', 'Day Label (e.g. Friday)', ev.day));
      row2.appendChild(bindEventSelect(ev.key, 'mode', 'Schedule Type', ev.mode || 'recurring', [
        { value: 'recurring', label: 'Weekly (recurring night)' },
        { value: 'fixed', label: 'One-off (fixed date & time)' }
      ], () => renderEventsList(list.__events)));
      card.appendChild(row2);

      const row3 = el('div', { class: 'field-row' });
      if ((ev.mode || 'recurring') === 'recurring') {
        row3.appendChild(bindEventSelect(ev.key, 'recurring', 'Night of the Week', ev.recurring, [
          { value: 0, label: 'Sunday' }, { value: 1, label: 'Monday' }, { value: 2, label: 'Tuesday' },
          { value: 3, label: 'Wednesday' }, { value: 4, label: 'Thursday' }, { value: 5, label: 'Friday' }, { value: 6, label: 'Saturday' }
        ], null, true));
        row3.appendChild(bindEventTime(ev.key, ev.startHour, ev.startMin));
      } else {
        row3.appendChild(bindEventDateTime(ev.key, ev.fixedDate));
      }
      card.appendChild(row3);

      card.appendChild(bindEventText(ev.key, 'desc', 'Description', ev.desc, 'textarea'));
      card.appendChild(buildEventGallery(ev.key));

      return card;
    }

    function renderEventsList(events) {
      list.innerHTML = '';
      if (!events.length) {
        list.appendChild(el('div', { class: 'empty-state' }, ['No events yet. Click "+ Add Event" to create one.']));
        return;
      }
      events.forEach((ev, idx) => list.appendChild(buildEventCard(ev, idx, events.length)));
    }

    onValue(ref(db, 'content/events'), (snap) => {
      if (panelEditing) return;
      const data = snap.val();
      const events = data
        ? Object.keys(data).map(k => ({ key: k, ...data[k] })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0))
        : [];
      list.__events = events;
      renderEventsList(events);
    });

    panel.appendChild(addBtn);
    panel.appendChild(list);
    return panel;
  }

  function buildComingSoonPanel(key, cfg) {
    const panel = el('section', { class: 'panel', id: `panel-${key}` });
    panel.appendChild(el('h2', { class: 'panel-title font-display', text: cfg.label }));
    const wrap = el('div', {
      class: 'section-card',
      style: 'display:flex; align-items:center; justify-content:center; min-height:220px;'
    });
    wrap.appendChild(el('p', {
      class: 'panel-subtitle',
      style: 'margin:0; font-size:1.1rem; font-weight:700; color:var(--gray);',
      text: 'Coming soon'
    }));
    panel.appendChild(wrap);
    return panel;
  }

  function buildSectionPanel(key, cfg) {
    if (cfg.custom === 'events') return buildEventsPanel(key, cfg);
    if (cfg.custom === 'comingSoon') return buildComingSoonPanel(key, cfg);
    const panel = el('section', { class: 'panel', id: `panel-${key}` });
    const defaults = DEFAULTS[key] || {};

    panel.appendChild(el('h2', { class: 'panel-title font-display', text: cfg.label }));
    panel.appendChild(el('p', { class: 'panel-subtitle', text: `Manage the ${cfg.label} section content. Changes appear instantly on the live site.` }));

    const textCard = el('div', { class: 'section-card' });
    const textHeader = el('div', { class: 'section-card-header' }, [
      el('h3', { text: 'Text Content' }),
      el('span', { class: 'count-badge', text: (cfg.texts || []).length })
    ]);
    textCard.appendChild(textHeader);

    if (cfg.toggle) textCard.appendChild(bindToggle(`content/${key}/${cfg.toggle.key}`, cfg.toggle, defaults[cfg.toggle.key]));
    (cfg.texts || []).forEach(field => {
      textCard.appendChild(bindText(`content/${key}/${field.key}`, field, defaults[field.key]));
    });
    panel.appendChild(textCard);

    if (cfg.list) panel.appendChild(bindList(key, cfg.list, defaults[cfg.list.key] || defaults.images || defaults.slides || defaults.cards));

    return panel;
  }

  const HOME_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg>';
  const EXPERIENCE_GROUP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>';
  const CHEVRON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';

  // ----- Collapsible nav-group definitions -----
  // Add an entry here for any SECTIONS `group` value to render it as a
  // collapsible group in the sidebar instead of a flat top-level tab.
  const NAV_GROUPS = {
    home: { label: 'Home Page', icon: HOME_ICON },
    experience: { label: 'Experience Page', icon: EXPERIENCE_GROUP_ICON }
  };

  function switchTab(key) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${key}`));

    Object.keys(NAV_GROUPS).forEach(groupKey => {
      const toggle = document.getElementById(`group-${groupKey}-toggle`);
      if (!toggle) return;
      const isInGroup = SECTIONS[key] && SECTIONS[key].group === groupKey;
      toggle.classList.toggle('has-active-child', isInGroup);
    });

    if (window.innerWidth <= 900) {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('mobileOverlay').classList.remove('open');
    }
  }

  function toggleNavGroup(groupKey, forceExpanded) {
    const toggle = document.getElementById(`group-${groupKey}-toggle`);
    const subgroup = document.getElementById(`group-${groupKey}-sub`);
    if (!toggle || !subgroup) return;
    const expand = typeof forceExpanded === 'boolean' ? forceExpanded : !toggle.classList.contains('expanded');
    toggle.classList.toggle('expanded', expand);
    subgroup.classList.toggle('expanded', expand);
  }

  let dashboardBuilt = false;
  function buildDashboard() {
    if (dashboardBuilt) return;
    dashboardBuilt = true;
    const nav = document.getElementById('sidebarNav');
    const main = document.getElementById('panelsContainer');

    const entries = Object.entries(SECTIONS);
    const firstKey = entries[0][0];

    // ----- Collapsible groups (Home Page, Experience Page, etc.) -----
    Object.entries(NAV_GROUPS).forEach(([groupKey, groupMeta]) => {
      const groupEntries = entries.filter(([, cfg]) => cfg.group === groupKey);
      if (!groupEntries.length) return;

      const navGroup = el('div', { class: 'nav-group' });

      const groupToggle = el('button', {
        type: 'button', id: `group-${groupKey}-toggle`, class: 'tab-btn nav-group-toggle',
        onclick: () => toggleNavGroup(groupKey)
      });
      groupToggle.innerHTML = `<span class="tab-icon">${groupMeta.icon}</span><span>${groupMeta.label}</span><span class="nav-chevron">${CHEVRON_ICON}</span>`;
      navGroup.appendChild(groupToggle);

      const subNav = el('div', { class: 'nav-subgroup', id: `group-${groupKey}-sub` });
      groupEntries.forEach(([key, cfg]) => {
        const btn = el('button', {
          type: 'button', class: 'tab-btn sub-tab-btn',
          onclick: () => switchTab(key)
        });
        btn.dataset.key = key;
        btn.innerHTML = `<span class="tab-icon">${cfg.icon}</span><span>${cfg.label}</span>`;
        subNav.appendChild(btn);
      });
      navGroup.appendChild(subNav);
      nav.appendChild(navGroup);
    });

    // ----- Standalone top-level pages (no group) -----
    entries.filter(([, cfg]) => !cfg.group).forEach(([key, cfg]) => {
      const btn = el('button', {
        type: 'button', class: 'tab-btn',
        onclick: () => switchTab(key)
      });
      btn.dataset.key = key;
      btn.innerHTML = `<span class="tab-icon">${cfg.icon}</span><span>${cfg.label}</span>`;
      nav.appendChild(btn);
    });

    // ----- Panels (all sections, any order is fine) -----
    entries.forEach(([key, cfg]) => {
      const panel = buildSectionPanel(key, cfg);
      main.appendChild(panel);
    });

    // Expand whichever group holds the default active tab
    Object.keys(NAV_GROUPS).forEach(groupKey => {
      toggleNavGroup(groupKey, SECTIONS[firstKey].group === groupKey);
    });
    switchTab(firstKey);
  }

  // ===== AUTH =====
  document.getElementById('googleSignInBtn').addEventListener('click', () => {
    signInWithPopup(auth, provider).catch(err => showToast('Sign-in failed: ' + err.message, true));
  });
  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');
    const loginError = document.getElementById('loginError');

    if (user) {
      const email = (user.email || '').toLowerCase();
      if (!ADMIN_EMAILS.map(e => e.toLowerCase()).includes(email)) {
        loginError.textContent = `${user.email} is not authorized.`;
        loginError.classList.remove('hidden');
        signOut(auth);
        return;
      }
      loginError.classList.add('hidden');
      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userAvatar').textContent = (user.displayName || user.email || 'A')[0].toUpperCase();
      buildDashboard();
      initializeDefaults();
      initializeEventsDefaults();
    } else {
      dashboard.classList.add('hidden');
      loginScreen.classList.remove('hidden');
    }
  });

  // ===== MOBILE MENU =====
  document.getElementById('mobileMenuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('mobileOverlay').classList.toggle('open');
  });
  document.getElementById('mobileOverlay').addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('mobileOverlay').classList.remove('open');
  });
</script>
</body>
</html>
